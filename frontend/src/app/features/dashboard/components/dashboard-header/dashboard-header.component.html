<header class="bg-white border-b border-gray-200 sticky top-0 z-50 w-full">
  <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-20">
    <!-- Left: Logo + Title -->
    <div class="flex items-center gap-6">
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div
          class="w-12 h-12 bg-gradient-to-br from-blue-900 to-blue-700 rounded-lg flex items-center justify-center shadow-md"
        >
          <svg
            class="w-8 h-8 text-white"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-sm font-bold text-gray-900 leading-tight"
            >PONTI</span
          >
          <span class="text-xs font-semibold text-blue-600 leading-tight"
            >MARRIOTT</span
          >
        </div>
      </div>

      <!-- Divider -->
      <div class="hidden md:block w-px h-10 bg-gray-200"></div>

      <!-- Page Title -->
      <div class="hidden md:block">
        <h1 class="text-xl font-bold text-gray-900">{{ title }}</h1>
        <p class="text-xs text-gray-500">{{ subtitle }}</p>
      </div>
    </div>

    <!-- Right: Notifications + User -->
    <div class="flex items-center gap-3">
      <!-- Notifications -->
      <button
        class="relative p-2 rounded-full hover:bg-gray-100 transition-colors"
      >
        <svg
          class="w-6 h-6 text-gray-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
          />
        </svg>
        <span
          class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"
        ></span>
      </button>

      <!-- User Profile -->
      <div class="flex items-center gap-3 pl-3 border-l border-gray-200">
        <img
          [src]="currentUser.avatar"
          [alt]="currentUser.name"
          class="w-10 h-10 rounded-full bg-gray-200 object-cover"
          onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23cbd5e1%22%3E%3Cpath d=%22M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z%22/%3E%3C/svg%3E'"
        />
        <div class="hidden sm:block">
          <p class="text-sm font-semibold text-gray-900">
            {{ currentUser.name }}
          </p>
          <p class="text-xs text-gray-500">{{ currentUser.role }}</p>
        </div>
      </div>
    </div>
  </div>
</header>
