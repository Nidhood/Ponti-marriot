<header
  class="w-full bg-slate-900/40 backdrop-blur supports-[backdrop-filter]:bg-slate-900/30"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <a
        class="flex items-center gap-3"
        [href]="navLinks.length > 0 ? navLinks[0].href : '#'"
        (click)="navClicked.emit('logo')"
      >
        <div class="relative h-15 w-15">
          <!-- Logo -->
          <img
            [ngSrc]="logoSrc"
            [alt]="logoAlt"
            fill
            priority
            class="object-contain"
          />
        </div>
        <span class="sr-only">{{ logoAlt }}</span>
      </a>

      <nav class="hidden md:flex items-center gap-8">
        <a
          *ngFor="let link of navLinks"
          [href]="link.href"
          (click)="navClicked.emit(link.href)"
          class="text-sm font-medium transition hover:text-white"
          [class.text-white]="link.active"
          [class.text-slate-300]="!link.active"
          [attr.aria-current]="link.active ? 'page' : null"
        >
          {{ link.label }}
        </a>

        <a
          *ngIf="ctaLabel"
          [href]="ctaHref"
          (click)="ctaClicked.emit()"
          class="inline-flex items-center rounded-full px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
        >
          {{ ctaLabel }}
        </a>
      </nav>

      <button
        type="button"
        class="md:hidden inline-flex items-center justify-center rounded-md p-2 text-slate-100 hover:bg-white/10 focus:outline-none"
        aria-label="Open main menu"
        (click)="toggleMobile()"
      >
        <svg
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            *ngIf="!mobileOpen"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
          <path
            *ngIf="mobileOpen"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <div *ngIf="mobileOpen" class="md:hidden border-t border-white/10">
    <div class="space-y-1 px-4 py-3">
      <a
        *ngFor="let link of navLinks"
        [href]="link.href"
        (click)="navClicked.emit(link.href); toggleMobile()"
        class="block rounded-md px-3 py-2 text-base font-medium"
        [class.text-white]="link.active"
        [class.text-slate-200]="!link.active"
      >
        {{ link.label }}
      </a>
      <a
        *ngIf="ctaLabel"
        [href]="ctaHref"
        (click)="ctaClicked.emit(); toggleMobile()"
        class="mt-2 block rounded-full bg-indigo-600 px-4 py-2 text-center text-sm font-semibold text-white hover:bg-indigo-700"
      >
        {{ ctaLabel }}
      </a>
    </div>
  </div>
</header>
