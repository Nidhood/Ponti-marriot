<div
  class="flex flex-col justify-center min-h-screen px-6 py-12 lg:px-12 bg-slate-900"
>
  <div class="w-full max-w-md mx-auto">
    <!-- Logo -->
    <div class="mb-8 flex justify-center">
      <img
        [ngSrc]="logoSrc"
        [alt]="logoAlt"
        width="250"
        height="250"
        priority
        class="h-40 w-auto object-contain"
      />
    </div>

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl lg:text-3xl font-bold text-white mb-2">
        {{ config.title }}
      </h1>
      <p class="text-sm text-slate-400">
        {{ config.subtitle }}
      </p>
    </div>

    <!-- Form -->
    <form
      [formGroup]="forgotPasswordForm"
      (ngSubmit)="onSubmit()"
      class="space-y-6"
    >
      <!-- Email Field -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-slate-300">
          {{ config.emailLabel }}
        </label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          [placeholder]="config.emailPlaceholder"
          class="!w-full !bg-slate-800/50 !text-slate-300 placeholder:!text-slate-500 !ring-1 focus:!ring-1 !rounded-lg !px-4 !py-3 !transition-all"
        />
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button
          type="submit"
          [disabled]="isFormInvalid"
          class="w-full bg-indigo-600 disabled:from-slate-700 disabled:to-slate-700 disabled:cursor-not-allowed disabled:opacity-50 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5"
        >
          {{ config.submitLabel }}
        </button>
      </div>

      <!-- Back to Sign In -->
      <div class="text-center">
        <a
          [href]="config.backToSigninLink"
          class="text-sm text-slate-400 hover:text-white transition-colors"
        >
          {{ config.backToSigninText }}
          <span class="font-semibold">Sign in</span>
        </a>
      </div>
    </form>
  </div>
</div>
